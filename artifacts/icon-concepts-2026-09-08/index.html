<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>情绪像素 · 图标提案</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:#262633;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1120px;margin:auto;padding:56px 40px 32px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#777581;margin:0 0 16px}h1{font-size:34px;letter-spacing:-1px;margin:0 0 12px;font-weight:650}.intro{color:#777581;font-size:14px;line-height:1.7;margin:0 0 36px}.concepts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:#fffefa;border:1px solid #e8e5de;border-radius:24px;padding:24px}.label{min-height:24px;display:flex;justify-content:space-between;align-items:center;color:#8a8690;font-size:11px;letter-spacing:.06em}.tag{color:#4b7768;background:#e8f0e9;padding:5px 8px;border-radius:6px}.hero{display:block;width:190px;max-width:100%;height:auto;border-radius:22.5%;margin:28px auto 32px}h2{font-size:20px;margin:0 0 10px;font-weight:600}.description{font-size:13px;line-height:1.85;color:#777581;margin:0;min-height:48px}.samples{display:flex;gap:10px;margin-top:25px;padding-top:20px;border-top:1px solid #efede7;align-items:center}.sample{height:72px;width:72px;border-radius:13px;display:grid;place-items:center;background:#edebe6}.sample.dark{background:#272b38}.sample img{width:48px;height:48px;border-radius:22.5%}.size-label{font-size:11px;line-height:1.6;color:#96919a;margin-left:2px}.note{color:#96919a;font-size:12px;line-height:1.8;margin:24px 0 0}.splash-review{margin-top:44px;padding-top:28px;border-top:1px solid #dedad2}.splash-review h2{font-size:18px}.splash-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}.launch{height:220px;border:1px solid #e8e5de;border-radius:18px;display:grid;place-items:center;background:#f4f5fb;position:relative}.launch.dark{background:#0b0d18;border-color:#0b0d18}.launch img{width:144px;height:144px;object-fit:contain}.launch span{position:absolute;bottom:15px;font-size:11px;color:#96919a}
    @media(max-width:780px){main{padding:30px 20px}.concepts{grid-template-columns:1fr}.card{max-width:430px;width:100%;margin:auto}.hero{width:200px}h1{font-size:29px}.description{min-height:0}.splash-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">情绪像素 / APP ICON / 2026.09</p>
    <h1>给心情，一个新样子。</h1>
    <p class="intro">三个不同方向。大图看气质，下面的小图看放到主屏幕后的辨识度。</p>
    <section class="concepts" aria-label="三个图标方案">
      <article class="card">
        <div class="label"><span>方案 01</span><span>记录感</span></div>
        <img class="hero" src="01-folded-page.png" alt="紫色背景上的奶油白折页和一条心情曲线">
        <h2>心情折页</h2>
        <p class="description">一张柔软的日记纸，一笔心情曲线。<br>保留紫色气质，突出随手记录。</p>
        <div class="samples"><div class="sample"><img src="01-folded-page.png" alt="浅色桌面中的 48 像素图标"></div><div class="sample dark"><img src="01-folded-page.png" alt="深色桌面中的 48 像素图标"></div><span class="size-label">主屏幕<br>48 px 预览</span></div>
      </article>
      <article class="card">
        <div class="label"><span>方案 02</span><span>陪伴感</span></div>
        <img class="hero" src="02-gentle-embrace.png" alt="奶油色背景上的深绿色拥抱与杏色圆点">
        <h2>温柔拥抱</h2>
        <p class="description">用一个拥抱，接住每天的感受。<br>安静、温暖，也更有自己的个性。</p>
        <div class="samples"><div class="sample"><img src="02-gentle-embrace.png" alt="浅色桌面中的 48 像素图标"></div><div class="sample dark"><img src="02-gentle-embrace.png" alt="深色桌面中的 48 像素图标"></div><span class="size-label">主屏幕<br>48 px 预览</span></div>
      </article>
      <article class="card">
        <div class="label"><span>方案 03</span><span class="tag">已选定 · 日历感</span></div>
        <img class="hero" src="03-mood-pixels.png" alt="深靛色背景上的彩色心情九宫格">
        <h2>情绪像素</h2>
        <p class="description">把每天的情绪，收进彩色格子里。<br>呼应心情日历，更活泼、醒目。</p>
        <div class="samples"><div class="sample"><img src="03-mood-pixels.png" alt="浅色桌面中的 48 像素图标"></div><div class="sample dark"><img src="03-mood-pixels.png" alt="深色桌面中的 48 像素图标"></div><span class="size-label">主屏幕<br>48 px 预览</span></div>
      </article>
    </section>
    <p class="note">已选定③「情绪像素」，正式图标已应用。产品名称更新为「情绪像素」。</p>

  </main>
</body>
</html>
